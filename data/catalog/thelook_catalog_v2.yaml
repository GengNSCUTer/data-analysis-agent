joins:
  - {join_id: order_items_orders, from_table: order_items, to_table: orders, cardinality: many_to_one, "on": "order_items.order_id = orders.order_id", reason: "订单商品行关联订单状态与唯一订单统计时间"}
  - {join_id: orders_users, from_table: orders, to_table: users, cardinality: many_to_one, "on": "orders.user_id = users.id", reason: "订单关联已脱敏客户地域和注册流量来源"}
  - {join_id: order_items_products, from_table: order_items, to_table: products, cardinality: many_to_one, "on": "order_items.product_id = products.id", reason: "订单商品行关联商品品类、品牌和部门"}
  - {join_id: order_items_inventory, from_table: order_items, to_table: inventory_items, cardinality: many_to_one, "on": "order_items.inventory_item_id = inventory_items.id", reason: "内部关联，v2 不将其用于订单成本或利润"}
  - {join_id: inventory_products, from_table: inventory_items, to_table: products, cardinality: many_to_one, "on": "inventory_items.product_id = products.id", reason: "库存单元关联商品维度"}
  - {join_id: products_distribution_centers, from_table: products, to_table: distribution_centers, cardinality: many_to_one, "on": "products.distribution_center_id = distribution_centers.id", reason: "商品默认配送中心关联"}
  - {join_id: inventory_distribution_centers, from_table: inventory_items, to_table: distribution_centers, cardinality: many_to_one, "on": "inventory_items.product_distribution_center_id = distribution_centers.id", reason: "库存单元关联配送中心"}
  - {join_id: events_users, from_table: events, to_table: users, cardinality: many_to_one, "on": "events.user_id = users.id", reason: "仅用于已知用户事件关联；v2 不将其作为订单归因桥接"}
