id: qlora_environment_v1
status: environment_bootstrap_verified
purpose: >-
  Isolated dependency environment for future local QLoRA/SFT experiments.
  It creates no training data, downloads no base model and does not start training.

environment:
  conda_prefix: /disk2/gengnan/conda_envs/data-analysis-agent-qlora
  python: "3.11"
  direct_requirements: infra/post_training/requirements-qlora-v1.in
  resolved_lockfile: infra/post_training/requirements-qlora-v1.lock
  torch_wheel: torch==2.5.1+cu121
  host_driver: "535.54.03"
  host_cuda_capability: "12.2"
  compatibility_decision: >-
    Use CUDA 12.1 PyTorch wheels because CUDA 12.4 wheels require a newer host
    driver. Do not upgrade the shared NVIDIA driver as part of this project.

device_policy:
  cuda_visible_devices: "1"
  logical_cuda_device: 1
  nvidia_smi_physical_device: 3
  gpu_name: NVIDIA GeForce RTX 4090
  gpu_uuid: GPU-10863af0-8588-7625-5609-640ba794f64b
  allocation_rule: >-
    Recheck nvidia-smi immediately before every GPU task. This environment does
    not authorize stopping, restarting or competing with other projects.

data_and_model_boundary:
  base_model_status: downloaded_frozen_external_only
  training_data_status: prepared_external_train_only_candidates
  spider_gold_sql_status: not_read
  protected_holdout_manifest: evals/manifests/post_training_holdout_v1.yaml
  production_runtime: PostgreSQL/Vanna unchanged

subsequent_artifacts:
  model:
    id: Qwen/Qwen2.5-Coder-1.5B
    revision: df3ce67c0e24480f20468b6ef2894622d69eb73b
    external_dir: /disk2/gengnan/data-analysis-agent-data/models/qwen2.5-coder-1.5b-base-df3ce67c0e24480f20468b6ef2894622d69eb73b
  candidates_manifest: evals/manifests/post_training_candidates_v1.yaml
  forward_smoke_manifest: evals/manifests/post_training_forward_smoke_v1.yaml

validation_plan:
  - conda_prefix_uses_python_3_11
  - direct_dependency_versions_match
  - pip_check_passes
  - torch_reports_cuda_available_when_device_is_free
  - CUDA_VISIBLE_DEVICES_1_resolves_to_physical_gpu_3

validation_result:
  verified_at: "2026-08-24"
  python_version: "3.11.15"
  torch_version: 2.5.1+cu121
  torch_cuda_runtime: "12.1"
  direct_packages:
    accelerate: "1.3.0"
    bitsandbytes: "0.45.1"
    datasets: "3.2.0"
    peft: "0.14.0"
    transformers: "4.48.3"
    trl: "0.15.2"
  pip_check: passed
  cuda_probe:
    cuda_available: true
    visible_device_count: 1
    process_local_device: 0
    resolved_gpu_uuid: GPU-10863af0-8588-7625-5609-640ba794f64b
  constraints:
    - no_base_model_downloaded
    - no_training_data_created
    - no_training_started

manifest_version: "1"
created_at: "2026-08-24"
