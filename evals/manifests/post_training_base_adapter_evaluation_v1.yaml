manifest_id: post_training_base_adapter_evaluation_v1
status: base_evaluated_adapter_generation_running
purpose: >-
  Compare the frozen Qwen/Qwen2.5-Coder-1.5B base and the first SFT LoRA adapter
  under identical Spider dev inputs, schema/question serialization and greedy
  decoding. This is an internal research comparison, not a production release
  or current official Spider leaderboard claim.
comparison_contract:
  base_model:
    id: Qwen/Qwen2.5-Coder-1.5B
    revision: df3ce67c0e24480f20468b6ef2894622d69eb73b
    download_manifest_sha256: 484d1e01b35f19c6c764d2801239c20ca17da4270a76869825bffc08022829c1
  adapter_source_manifest: evals/manifests/post_training_sft_smoke_v1.yaml
  prompt_format_version: spider-sft-schema-question-sql-v1
  inference_script: scripts/generate_post_training_text_to_sql.py
  orchestration_script: scripts/start_post_training_base_adapter_comparison_pair_screen.sh
  dataset:
    id: spider_dev
    release: spider-1.0-kaggle-mirror-v1-2020-01-27
    native_case_count: 1034
    raw_inputs_outside_git: true
    spider_dev_gold_sql_read_for_generation: false
  decode:
    do_sample: false
    num_beams: 1
    seed: 42
    max_input_tokens: 1536
    max_new_tokens: 256
  candidate_normalization:
    implementation: src/data_analysis_agent/text_to_sql_output.py
    applies_to:
      - SQLite_diagnostic
      - official_Test_Suite_bridge
    allowed_wrapper_removals:
      - opening_SQL_code_fence
      - SQLQuery_or_SQL_prefix
      - answer_or_explanation_Markdown_heading_and_later_content
    prohibited_behavior:
      - SQL_syntax_repair
      - schema_or_identifier_repair
      - join_predicate_or_aggregation_repair
      - gold_SQL_access
  invariant_between_runs:
    - base_model_revision
    - model_loading_quantization
    - schema_question_serialization
    - native_case_order
    - greedy_decode_parameters
    - SQLite diagnostic settings
    - Test Suite bridge and evaluator commit
  intended_observations:
    - complete_prediction_coverage
    - SQLite_policy_and_execution_diagnostics
    - unmodified_Test_Suite_output
    - generation_latency_and_token_counts
    - error_category_deltas
preflight:
  native_dev_prompt_max_tokens: 365
  native_dev_prompts_over_max_input_tokens: 0
  two_case_smoke:
    base:
      generated_tokens: 512
      sqlite_executed_candidates: 0
      sqlite_policy_rejected_candidates: 2
    adapter:
      generated_tokens: 12
      sqlite_executed_candidates: 2
      sqlite_policy_rejected_candidates: 0
  interpretation: >-
    The smoke proves both controlled paths generate external candidates and
    reach the same SQLite diagnostic runner. It is too small to establish a
    Text-to-SQL quality delta.
  prohibited_interpretations:
    - no_current_official_Spider_leaderboard_claim
    - no_business_semantic_accuracy_claim_without_manual_review
    - no_production_PostgreSQL_or_Vanna_replacement
execution_state:
  base_generation:
    status: completed_and_evaluated
    completed_cases: 1034
    prediction_jsonl_sha256: 8978b8ab0734069f4975810ba19e6221db4cfeb2545e357778f12cfcca29cc0e
    generated_tokens: 128957
    generation_elapsed_ms: 4631685
    recovery_required: false
    recovery_history: >-
      SQLite diagnostics stopped on a malformed model candidate because the
      policy only caught ParseError and not sqlglot TokenError. The diagnostic
      now maps all sqlglot parser/tokenizer failures to policy_rejected and
      continues the batch. A subsequent bridge recovery exposed Markdown answer
      sections in raw completions; the shared normalizer removes only those
      presentation wrappers for both members before either evaluator.
    pre_normalization_sqlite_diagnostic_sha256: 320f68dee858dd71409998ab03c555bdb5521a9dbc1115c448957e0b37a101ef
    normalized_sqlite_diagnostic:
      report_sha256: 433cf3a7a4d358547a0bfa72ad239ee594297eedf76a9ad1d17c7102315d071b
      executed_candidates: 831
      policy_rejected_candidates: 4
      execution_error_candidates: 199
      timeout_candidates: 0
    official_test_suite_internal_result:
      status: completed_unmodified_evaluator_output_not_leaderboard_claim
      evaluated_cases: 1034
      raw_execution_values:
        easy: 0.748
        medium: 0.448
        hard: 0.241
        extra: 0.094
        all: 0.427
      normalized_prediction_input_sha256: 207585672ec91bd9aa455f525a3e1d89736d9415fd77ba88679178a5315936d9
      raw_output_sha256: ddec7e34daee62b2f5bbe767407cde979c9f4e0bc5a168a1ca9de95b10b39f5e
  adapter_generation:
    status: running
  official_test_suite:
    base_status: completed_unmodified_evaluator_output_not_leaderboard_claim
    adapter_status: not_started
recovery_contract:
  opt_in_environment_variable: BASE_REUSE_GENERATION=1
  requires_existing_base_artifacts:
    - generation_evidence.json
    - predictions.jsonl
  rejects_existing_official_evaluator_evidence: true
  raw_artifacts_remain_outside_git: true
boundaries:
  raw_predictions_sql_and_reports_in_git: false
  adapter_checkpoint_and_weights_in_git: false
  v2_project_holdout_used: false
  production_postgres_or_vanna_modified: false
