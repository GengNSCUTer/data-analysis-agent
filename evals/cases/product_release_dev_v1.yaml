    expected: {route_state: answerable, intent: data_query, requires_database: true, metric_ids: [gmv, paid_order_count], time_grain: month, check_id: monthly_multi_metric_trend}
  - case_id: prd-trend-10
    category: comparison_trend
    question: 对比各州平均履约天数和准时送达率
    expected: {route_state: answerable, intent: data_query, requires_database: true, metric_ids: [average_delivery_days, on_time_delivery_rate], dimensions: [customer_state], comparison: dimension_comparison, check_id: state_delivery_comparison}

  # Multi-turn continuity (10 scripts, two or three turns each)
  - case_id: prd-multi-01
    category: multi_turn
    steps:
      - {step_id: turn-1, message: 哪个州销售额最高, expected: {route_state: answerable, intent: data_query, requires_database: true, metric_ids: [gmv], dimensions: [customer_state]}}
      - {step_id: turn-2, message: 这个州哪些商品卖得好, expected: {route_state: answerable, intent: data_query, requires_database: true, metric_ids: [gmv], dimensions: [product_category_name], requires_reference: customer_state}}
      - {step_id: turn-3, message: 排名前十的商品种类都给一下, expected: {route_state: answerable, intent: data_query, requires_database: true, metric_ids: [gmv], dimensions: [product_category_name], top_n: 10, requires_reference: customer_state}}
  - case_id: prd-multi-02
    category: multi_turn
    steps:
      - {step_id: turn-1, message: 2017年统计 GMV, expected: {route_state: answerable, intent: data_query, requires_database: true, metric_ids: [gmv]}}
      - {step_id: turn-2, message: 改成按州分组看前五名, expected: {route_state: answerable, intent: data_query, requires_database: true, metric_ids: [gmv], dimensions: [customer_state], top_n: 5}}
