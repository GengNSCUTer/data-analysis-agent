    category: comparison_trend
    question: 对比2017年与2018年的有效订单数
    expected: {route_state: answerable, intent: data_query, requires_database: true, metric_ids: [paid_order_count], comparison: year_over_year, check_id: compare_orders_years}
  - case_id: prd-trend-03
