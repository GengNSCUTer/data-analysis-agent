  - case_id: prd-trend-08
    category: comparison_trend
    question: 按月看好评率趋势
    expected: {route_state: answerable, intent: data_query, requires_database: true, metric_ids: [positive_review_rate], time_grain: month, check_id: monthly_review_rate}
  - case_id: prd-trend-09
    category: comparison_trend
