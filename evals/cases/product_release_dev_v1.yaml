suite_id: product-release-dev-v1
suite_version: "1.0"
workspace_id: olist-demo
usage: runtime_regression_only
forbidden_uses:
  - dpo_source
  - few_shot
  - local_model_checkpoint_selection
  - protected_final_test
  - sft_training
  - sft_validation
category_targets:
  single_turn: 10
  clarification: 10
  comparison_trend: 10
  multi_turn: 10
  safety_scope: 10
  chart_download_empty: 10
scope_note: >-
  Independent product-development cases. They measure the Olist trusted
  runtime only and are not derived from protected final tests or training
  rows. The expected fields describe semantic intent and result shape; they
  do not contain SQL text or result values. Independent numeric checks are
  named by check_id and are written to the external evaluation directory.
artifact_boundary:
  external_root: /disk2/gengnan/data-analysis-agent-data/evals/product-release-dev-v1
  external_only: [raw_sse_events, sql_text, database_result_rows, screenshots]

cases:
  # Single-turn business questions (10)
  - case_id: prd-single-01
    category: single_turn
    question: 统计 GMV
    expected: {route_state: answerable, intent: data_query, requires_database: true, metric_ids: [gmv], dimensions: [], check_id: scalar_gmv}
  - case_id: prd-single-02
    category: single_turn
    question: 统计有效订单数
    expected: {route_state: answerable, intent: data_query, requires_database: true, metric_ids: [paid_order_count], dimensions: [], check_id: scalar_paid_orders}
  - case_id: prd-single-03
    category: single_turn
    question: 统计平均履约天数
    expected: {route_state: answerable, intent: data_query, requires_database: true, metric_ids: [average_delivery_days], dimensions: [], check_id: scalar_delivery}
  - case_id: prd-single-04
    category: single_turn
    question: 按州统计 GMV 前十名
    expected: {route_state: answerable, intent: data_query, requires_database: true, metric_ids: [gmv], dimensions: [customer_state], top_n: 10, check_id: state_gmv_top10}
  - case_id: prd-single-05
    category: single_turn
    question: 按商品品类统计有效订单数前十名
    expected: {route_state: answerable, intent: data_query, requires_database: true, metric_ids: [paid_order_count], dimensions: [product_category_name], top_n: 10, check_id: category_orders_top10}
  - case_id: prd-single-06
    category: single_turn
    question: 2017年按月统计 GMV
    expected: {route_state: answerable, intent: data_query, requires_database: true, metric_ids: [gmv], dimensions: [], time_grain: month, check_id: monthly_gmv_2017}
  - case_id: prd-single-07
    category: single_turn
    question: 2017年按季度统计有效订单数
    expected: {route_state: answerable, intent: data_query, requires_database: true, metric_ids: [paid_order_count], dimensions: [], time_grain: quarter, check_id: quarterly_orders_2017}
  - case_id: prd-single-08
    category: single_turn
    question: 概览 GMV、有效订单数、平均履约天数和好评率
    expected: {route_state: answerable, intent: data_query, requires_database: true, metric_ids: [gmv, paid_order_count, average_delivery_days, positive_review_rate], dimensions: [], check_id: overview_four_metrics}
  - case_id: prd-single-09
    category: single_turn
    question: 按州统计平均订单价值
    expected: {route_state: answerable, intent: data_query, requires_database: true, metric_ids: [average_order_value], dimensions: [customer_state], check_id: state_aov}
  - case_id: prd-single-10
    category: single_turn
    question: 按州统计 GMV 前十名并生成柱状图
    expected: {route_state: answerable, intent: data_query, requires_database: true, metric_ids: [gmv], dimensions: [customer_state], chart_type: bar, check_id: chart_state_gmv}

  # Clarification and unsupported-boundary questions (10)
