  - case_id: prd-clarify-08
    category: clarification
    question: 预测下个月的订单数
    expected: {route_state: unsupported, intent: unsupported, requires_database: false, metric_ids: [], check_id: unsupported_prediction}
  - case_id: prd-clarify-09
    category: clarification
    question: 查一下订单明细
    expected: {route_state: clarification_required, intent: clarification_required, requires_database: false, metric_ids: [], check_id: missing_metric}
  - case_id: prd-clarify-10
