  - case_id: prd-multi-04
    category: multi_turn
    steps:
      - {step_id: turn-1, message: 各州有效订单数前十名, expected: {route_state: answerable, intent: data_query, requires_database: true, metric_ids: [paid_order_count], dimensions: [customer_state], top_n: 10}}
