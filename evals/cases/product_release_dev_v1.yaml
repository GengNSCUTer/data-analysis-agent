      - {step_id: turn-2, message: 只保留 SP 州, expected: {route_state: answerable, intent: data_query, requires_database: true, metric_ids: [gmv], dimensions: [customer_state], requires_filter: customer_state}}
  - case_id: prd-multi-06
    category: multi_turn
    steps:
