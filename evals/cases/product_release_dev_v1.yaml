      - {step_id: turn-1, message: 查一下2017年GMV, expected: {route_state: answerable, intent: data_query, requires_database: true, metric_ids: [gmv]}}
      - {step_id: turn-2, message: 开一个新分析, new_conversation_before: true, expected: {route_state: clarification_required, intent: clarification_required, requires_database: false, metric_ids: []}}

