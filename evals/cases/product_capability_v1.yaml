            dimensions: [customer_state]
      - step_id: turn-2
        message: 不按州了，改看商品品类。
        expected:
          terminal_state: answerable
          requires_database: true
          intent: data_query
          evidence_mode: database_result
          memory:
            metric_ids: [paid_order_count]
            time_range: ["2017-01-01", "2017-12-31"]
            dimensions: [product_category_name]

  - case_id: pcv1-c-result-followup-1
    category: trusted_result_followup
    steps:
      - step_id: turn-1
        message: 2017 年按月统计 GMV。
        expected:
          terminal_state: answerable
          requires_database: true
          intent: data_query
          evidence_mode: database_result
          trusted_result_summary: false
      - step_id: turn-2
        message: 这个结果为什么这么高？
        expected:
          terminal_state: result_followup
          requires_database: false
          intent: result_followup
          evidence_mode: previous_result
          trusted_result_summary: true
          tool_free: true

  - case_id: pcv1-c-result-followup-2
    category: trusted_result_followup
    steps:
      - step_id: turn-1
        message: 2017 年按州统计有效订单数前五名。
        expected:
          terminal_state: answerable
          requires_database: true
          intent: data_query
          evidence_mode: database_result
          trusted_result_summary: false
      - step_id: turn-2
        message: 刚才排名第一的州，结果是否合理？
        expected:
          terminal_state: result_followup
          requires_database: false
          intent: result_followup
          evidence_mode: previous_result
          trusted_result_summary: true
          tool_free: true

  - case_id: pcv1-c-followup-without-result
    category: followup_without_trusted_result
    steps:
      - step_id: turn-1
        message: 这个结果为什么这么高？
        expected:
          terminal_state: clarification_required
          requires_database: false
          intent: clarification_required
          evidence_mode: clarification
          trusted_result_summary: false
      - step_id: turn-2
        message: 那就重新统计 2017 年的 GMV。
        expected:
          terminal_state: answerable
          requires_database: true
          intent: data_query
          evidence_mode: database_result
          trusted_result_summary: false

  - case_id: pcv1-c-new-conversation
    category: conversation_isolation
    steps:
      - step_id: turn-1
        message: 2017 年统计 GMV。
        expected:
          terminal_state: answerable
          requires_database: true
          intent: data_query
          evidence_mode: database_result
          memory:
            metric_ids: [gmv]
            time_range: ["2017-01-01", "2017-12-31"]
      - step_id: turn-2
        message: 按州看前五名。
        new_conversation_before: true
        expected:
          terminal_state: missing_metric
          requires_database: false
          intent: clarification_required
          evidence_mode: clarification
          memory:
            metric_ids: []
            time_range: null
            pending_missing: [metric]

  - case_id: pcv1-c-refresh-recovery
    category: conversation_reload
    steps:
      - step_id: turn-1
        message: 2017 年统计 GMV。
        expected:
          terminal_state: answerable
          requires_database: true
          intent: data_query
          evidence_mode: database_result
          memory:
            metric_ids: [gmv]
            time_range: ["2017-01-01", "2017-12-31"]
      - step_id: turn-2
        message: 刚才的 GMV 按州拆分。
        reload_client_before: true
        expected:
          terminal_state: answerable
          requires_database: true
          intent: data_analysis
          evidence_mode: database_result
          memory:
            metric_ids: [gmv]
            time_range: ["2017-01-01", "2017-12-31"]
            dimensions: [customer_state]

  - case_id: pcv1-c-long-history-budget
    category: context_budget
    steps:
