  - case_id: pcv1-b-state-ontime
    category: two_stage_aggregate
    question: 按州统计准时送达率
    expected:
      expected_intent: data_query
      requires_database: true
      expected_evidence_mode: database_result
      expected_metric_ids: [on_time_delivery_rate]
      terminal_state: answerable
      expected_reason_code: matched_catalog_and_no_blocking_ambiguity
      result_shape: state_grouped
      expected_dimensions: [customer_state]
      expected_required_result_columns: [customer_state, on_time_delivery_rate]
      aggregation_program: delivered_order_status_then_rate

  # 3 chart requests; chart semantics are server-derived, not model-selected.
  - case_id: pcv1-b-chart-state-gmv
