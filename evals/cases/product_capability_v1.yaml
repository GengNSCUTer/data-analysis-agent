      expected_plan_type: grouped_multi_metric
      expected_dimensions: [customer_state]
      expected_required_result_columns: [customer_state, paid_order_count, gmv]
  - case_id: pcv1-b-month-multi
    category: multi_metric
    question: 2017年按月统计 GMV 和有效订单数
    expected:
      expected_intent: data_query
      requires_database: true
      expected_evidence_mode: database_result
