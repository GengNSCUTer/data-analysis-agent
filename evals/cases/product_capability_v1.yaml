      expected_evidence_mode: database_result
      expected_metric_ids: [gmv]
      terminal_state: answerable
      expected_reason_code: matched_catalog_and_no_blocking_ambiguity
      result_shape: scalar
      expected_required_result_columns: [gmv]
  - case_id: pcv1-b-scalar-orders
    category: scalar
    question: 统计有效订单数
    expected:
      expected_intent: data_query
      requires_database: true
      expected_evidence_mode: database_result
      expected_metric_ids: [paid_order_count]
      terminal_state: answerable
      expected_reason_code: matched_catalog_and_no_blocking_ambiguity
      result_shape: scalar
      expected_required_result_columns: [paid_order_count]

  # 3 dimension-grouped queries
  - case_id: pcv1-b-state-gmv
    category: dimension_grouped
    question: 按州统计 GMV 前十名
    expected:
      expected_intent: data_query
      requires_database: true
      expected_evidence_mode: database_result
      expected_metric_ids: [gmv]
      terminal_state: answerable
      expected_reason_code: matched_catalog_and_no_blocking_ambiguity
