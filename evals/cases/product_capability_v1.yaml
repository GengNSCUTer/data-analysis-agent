      expected_required_result_columns: [customer_state, paid_order_count]
      chart_type: bar
      chart_x: customer_state
      chart_y: [paid_order_count]
conversation_scripts:
  - case_id: pcv1-c-date-followup-1
    category: clarification_carry_forward
    steps:
      - step_id: turn-1
        message: 本月 GMV 是多少？
        expected:
          terminal_state: missing_time
          requires_database: false
          intent: data_query
          evidence_mode: clarification
          memory:
            metric_ids: [gmv]
            time_range: null
            pending_missing: [time_range]
      - step_id: turn-2
        message: 统计 2017 年的 GMV。
        expected:
          terminal_state: answerable
          requires_database: true
          intent: data_query
          evidence_mode: database_result
          memory:
            metric_ids: [gmv]
            time_range: ["2017-01-01", "2017-12-31"]
            pending_missing: []

  - case_id: pcv1-c-date-followup-2
    category: clarification_carry_forward
