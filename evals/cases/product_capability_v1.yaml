      expected_dimensions: [customer_state]
      expected_required_result_columns: [customer_state, gmv]
  - case_id: pcv1-b-category-gmv
    category: dimension_grouped
    question: 按品类统计 GMV 前十名
    expected:
      expected_intent: data_query
      requires_database: true
      expected_evidence_mode: database_result
      expected_metric_ids: [gmv]
      terminal_state: answerable
      expected_reason_code: matched_catalog_and_no_blocking_ambiguity
      result_shape: category_grouped
      expected_dimensions: [product_category_name]
      expected_required_result_columns: [product_category_name, gmv]
  - case_id: pcv1-b-state-delivery
    category: dimension_grouped
    question: 各州平均履约天数
    expected:
      expected_intent: data_query
      requires_database: true
      expected_evidence_mode: database_result
      expected_metric_ids: [average_delivery_days]
      terminal_state: answerable
      expected_reason_code: matched_catalog_and_no_blocking_ambiguity
      result_shape: state_grouped
      expected_dimensions: [customer_state]
      expected_required_result_columns: [customer_state, average_delivery_days]

  # 3 time-series queries
  - case_id: pcv1-b-month-gmv
    category: time_series
    question: 2017年按月统计 GMV
    expected:
      expected_intent: data_query
      requires_database: true
      expected_evidence_mode: database_result
      expected_metric_ids: [gmv]
      terminal_state: answerable
      expected_reason_code: matched_catalog_and_no_blocking_ambiguity
      result_shape: time_series
      time_grain: month
      expected_required_result_columns: [gmv, time]
  - case_id: pcv1-b-month-review
    category: time_series
    question: 2018年按月统计好评率
    expected:
      expected_intent: data_query
      requires_database: true
      expected_evidence_mode: database_result
      expected_metric_ids: [positive_review_rate]
      terminal_state: answerable
      expected_reason_code: matched_catalog_and_no_blocking_ambiguity
      result_shape: time_series
      time_grain: month
      expected_required_result_columns: [positive_review_rate, time]
  - case_id: pcv1-b-quarter-orders
    category: time_series
    question: 2017年按季度统计有效订单数
    expected:
      expected_intent: data_query
      requires_database: true
      expected_evidence_mode: database_result
      expected_metric_ids: [paid_order_count]
      terminal_state: answerable
      expected_reason_code: matched_catalog_and_no_blocking_ambiguity
      result_shape: time_series
      time_grain: quarter
      expected_required_result_columns: [paid_order_count, time]

  # 3 multi-metric queries
  - case_id: pcv1-b-overview-multi
    category: multi_metric
    question: 概览 GMV、有效订单数、平均履约天数和好评率
    expected:
      expected_intent: data_query
      requires_database: true
      expected_evidence_mode: database_result
      expected_metric_ids: [average_delivery_days, paid_order_count, gmv, positive_review_rate]
      terminal_state: answerable
      expected_reason_code: matched_catalog_and_no_blocking_ambiguity
      result_shape: scalar_summary
      expected_plan_type: scalar_multi_metric_overview
      expected_required_result_columns: [average_delivery_days, paid_order_count, gmv, positive_review_rate]
  - case_id: pcv1-b-state-multi
