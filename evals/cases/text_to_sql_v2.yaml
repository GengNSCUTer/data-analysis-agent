    question: "这个结果为什么这么高？"
    conversation_state:
      previous_result_summary: "GMV 为 100，范围为 2017 年。"
    expected_state: result_followup
    expected_intent: result_followup
    requires_database: false
    expected_evidence_mode: previous_result
    expected_metric_ids: []
    expected_reason_code: followup_on_trusted_result
