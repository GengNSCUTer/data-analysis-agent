# 新编在线开发题，不用于训练或protected final；reference_sql由业务定义独立编写。
workspace_id: thelook-demo
metric_count: 20
categories: {metric: 20, grouped: 10, time: 8, continuous: 10, boundary: 8, output: 4}
cases:
  - id: metric-01
    category: metric
    question: 全部数据的已完成成交额是多少？不要假定币种。
    reference_sql: SELECT SUM(i.sale_price) AS completed_sale_amount FROM analytics.order_items i JOIN analytics.orders o ON o.order_id=i.order_id WHERE o.status='Complete'
  - id: metric-02
    category: metric
    question: 完成交易里一共有多少个商品行？不是去重SKU数量。
    reference_sql: SELECT COUNT(*) AS completed_item_count FROM analytics.order_items i JOIN analytics.orders o ON o.order_id=i.order_id WHERE o.status='Complete'
  - id: metric-03
    category: metric
    question: 目前快照里有多少笔已完成订单？
    reference_sql: SELECT COUNT(*) AS completed_order_count FROM analytics.orders WHERE status='Complete'
  - id: metric-04
    category: metric
    question: 全部时间的平均完成订单金额是多少？先算每笔订单金额再求平均。
    reference_sql: SELECT AVG(amount) AS average_order_value FROM (SELECT o.order_id,SUM(i.sale_price) AS amount FROM analytics.orders o JOIN analytics.order_items i ON i.order_id=o.order_id WHERE o.status='Complete' GROUP BY o.order_id) q
  - id: metric-05
    category: metric
    question: 平均每个完成订单有多少个商品行？
    reference_sql: SELECT AVG(n) AS average_items_per_completed_order FROM (SELECT o.order_id,COUNT(*) AS n FROM analytics.orders o JOIN analytics.order_items i ON i.order_id=o.order_id WHERE o.status='Complete' GROUP BY o.order_id) q
  - id: metric-06
    category: metric
    question: 被取消的订单总共有多少？
    reference_sql: SELECT COUNT(*) AS cancelled_order_count FROM analytics.orders WHERE status='Cancelled'
  - id: metric-07
    category: metric
    question: 统计所有已退货订单的数量。
    reference_sql: SELECT COUNT(*) AS returned_order_count FROM analytics.orders WHERE status='Returned'
  - id: metric-08
    category: metric
    question: 从下单到送达，已完成订单平均要几天？不足一天的部分也要计算。
    reference_sql: SELECT AVG(EXTRACT(EPOCH FROM (delivered_at-created_at))/86400.0) AS average_fulfillment_days FROM analytics.orders WHERE status='Complete' AND delivered_at IS NOT NULL AND delivered_at>=created_at
  - id: metric-09
    category: metric
    question: 有发货记录的订单从创建到发货平均需要多久，单位天？
    reference_sql: SELECT AVG(EXTRACT(EPOCH FROM (shipped_at-created_at))/86400.0) AS average_dispatch_days FROM analytics.orders WHERE shipped_at IS NOT NULL AND shipped_at>=created_at
  - id: metric-10
    category: metric
    question: 发货之后到送达的平均运输时长是多少天？缺失记录别当零。
    reference_sql: SELECT AVG(EXTRACT(EPOCH FROM (delivered_at-shipped_at))/86400.0) AS average_transit_days FROM analytics.orders WHERE shipped_at IS NOT NULL AND delivered_at IS NOT NULL AND delivered_at>=shipped_at
  - id: metric-11
    category: metric
    question: 有合法送达和退货时间的订单，平均送达后几天退货？
    reference_sql: SELECT AVG(EXTRACT(EPOCH FROM (returned_at-delivered_at))/86400.0) AS average_post_delivery_return_days FROM analytics.orders WHERE returned_at IS NOT NULL AND delivered_at IS NOT NULL AND returned_at>=delivered_at
  - id: metric-12
    category: metric
    question: 按现有口径算全部时间的退货率，用0到1的小数表示。
    reference_sql: SELECT COUNT(*) FILTER (WHERE status='Returned')::numeric/NULLIF(COUNT(*),0) AS return_rate FROM analytics.orders WHERE status IN ('Complete','Returned')
  - id: metric-13
    category: metric
    question: 至少完成过一笔交易的客户有多少人？同一人只算一次。
    reference_sql: SELECT COUNT(DISTINCT user_id) AS completed_customer_count FROM analytics.orders WHERE status='Complete'
  - id: metric-14
    category: metric
    question: 一共登记入库了多少个库存单元？
    reference_sql: SELECT COUNT(*) AS received_inventory_unit_count FROM analytics.inventory_items WHERE created_at IS NOT NULL
  - id: metric-15
    category: metric
    question: 一共有多少个已经售出的库存单元？
    reference_sql: SELECT COUNT(*) AS sold_inventory_unit_count FROM analytics.inventory_items WHERE sold_at IS NOT NULL
  - id: metric-16
    category: metric
    question: 当前快照还有多少库存单元没有售出？
    reference_sql: SELECT COUNT(*) AS current_unsold_inventory_unit_count FROM analytics.inventory_items WHERE sold_at IS NULL
  - id: metric-17
    category: metric
    question: 已售库存从入库到售出平均花了多少天？
    reference_sql: SELECT AVG(EXTRACT(EPOCH FROM (sold_at-created_at))/86400.0) AS average_days_to_sale FROM analytics.inventory_items WHERE sold_at IS NOT NULL AND sold_at>=created_at
  - id: metric-18
    category: metric
    question: 行为事件总共有多少条，匿名用户的也要计入？
    reference_sql: SELECT COUNT(*) AS event_count FROM analytics.events WHERE created_at IS NOT NULL
  - id: metric-19
    category: metric
    question: 行为数据里去重后的会话数是多少？不要输出会话ID。
    reference_sql: SELECT COUNT(DISTINCT session_id) AS unique_session_count FROM analytics.events WHERE created_at IS NOT NULL
  - id: metric-20
    category: metric
    question: 全部时间共注册了多少个用户？不是成交客户数。
    reference_sql: SELECT COUNT(*) AS registered_user_count FROM analytics.users WHERE created_at IS NOT NULL

  - id: grouped-01
    category: grouped
    question: 按商品部门汇总已完成成交额。
    reference_sql: SELECT p.department AS product_department,SUM(i.sale_price) AS completed_sale_amount FROM analytics.order_items i JOIN analytics.orders o ON o.order_id=i.order_id JOIN analytics.products p ON p.id=i.product_id WHERE o.status='Complete' GROUP BY p.department
  - id: grouped-02
    category: grouped
    question: 已完成成交额最高的十个商品品牌是哪些？
    reference_sql: SELECT p.brand AS product_brand,SUM(i.sale_price) AS completed_sale_amount FROM analytics.order_items i JOIN analytics.orders o ON o.order_id=i.order_id JOIN analytics.products p ON p.id=i.product_id WHERE o.status='Complete' GROUP BY p.brand ORDER BY completed_sale_amount DESC,product_brand LIMIT 10
  - id: grouped-03
    category: grouped
    question: 按客户注册流量来源比较平均完成订单金额。
    reference_sql: SELECT traffic_source AS customer_traffic_source,AVG(amount) AS average_order_value FROM (SELECT o.order_id,u.traffic_source,SUM(i.sale_price) AS amount FROM analytics.orders o JOIN analytics.users u ON u.id=o.user_id JOIN analytics.order_items i ON i.order_id=o.order_id WHERE o.status='Complete' GROUP BY o.order_id,u.traffic_source) q GROUP BY traffic_source
  - id: grouped-04
    category: grouped
    question: 各个商品品类当前未售的库存单元分别有多少？
    reference_sql: SELECT product_category,COUNT(*) AS current_unsold_inventory_unit_count FROM analytics.inventory_items WHERE sold_at IS NULL GROUP BY product_category
  - id: grouped-05
    category: grouped
    question: 按配送中心看入库库存单元数。
    reference_sql: SELECT d.name AS distribution_center,COUNT(*) AS received_inventory_unit_count FROM analytics.inventory_items i JOIN analytics.distribution_centers d ON d.id=i.product_distribution_center_id WHERE i.created_at IS NOT NULL GROUP BY d.name
  - id: grouped-06
    category: grouped
    question: 各种行为事件类型分别发生多少次？
    reference_sql: SELECT event_type,COUNT(*) AS event_count FROM analytics.events WHERE created_at IS NOT NULL GROUP BY event_type
  - id: grouped-07
    category: grouped
    question: 按浏览器统计去重会话数。
    reference_sql: SELECT browser AS event_browser,COUNT(DISTINCT session_id) AS unique_session_count FROM analytics.events WHERE created_at IS NOT NULL GROUP BY browser
  - id: grouped-08
    category: grouped
    question: 不同注册来源分别带来多少注册用户？
    reference_sql: SELECT traffic_source AS user_traffic_source,COUNT(*) AS registered_user_count FROM analytics.users WHERE created_at IS NOT NULL GROUP BY traffic_source
  - id: grouped-09
    category: grouped
    question: 按注册用户所在国家统计注册用户数。
    reference_sql: SELECT country AS user_country,COUNT(*) AS registered_user_count FROM analytics.users WHERE created_at IS NOT NULL GROUP BY country
  - id: grouped-10
    category: grouped
    question: 不同客户州的退货率分别是多少？用小数比例表示。
    reference_sql: SELECT u.state AS customer_state,COUNT(*) FILTER (WHERE o.status='Returned')::numeric/NULLIF(COUNT(*),0) AS return_rate FROM analytics.orders o JOIN analytics.users u ON u.id=o.user_id WHERE o.status IN ('Complete','Returned') GROUP BY u.state

  - id: time-01
    category: time
    question: 2023年每个月的已完成成交额是多少？
    reference_sql: SELECT DATE_TRUNC('month',o.created_at) AS time,SUM(i.sale_price) AS completed_sale_amount FROM analytics.orders o JOIN analytics.order_items i ON i.order_id=o.order_id WHERE o.status='Complete' AND o.created_at>='2023-01-01' AND o.created_at<'2024-01-01' GROUP BY 1
  - id: time-02
    category: time
    question: 2023年按季度统计已完成订单数。
    reference_sql: SELECT DATE_TRUNC('quarter',created_at) AS time,COUNT(*) AS completed_order_count FROM analytics.orders WHERE status='Complete' AND created_at>='2023-01-01' AND created_at<'2024-01-01' GROUP BY 1
  - id: time-03
    category: time
    question: 2023年1月每天取消了多少订单？按订单创建日期统计。
    reference_sql: SELECT DATE_TRUNC('day',created_at) AS time,COUNT(*) AS cancelled_order_count FROM analytics.orders WHERE status='Cancelled' AND created_at>='2023-01-01' AND created_at<'2023-02-01' GROUP BY 1
  - id: time-04
    category: time
    question: 2023年每周新增入库库存单元有多少？
    reference_sql: SELECT DATE_TRUNC('week',created_at) AS time,COUNT(*) AS received_inventory_unit_count FROM analytics.inventory_items WHERE created_at>='2023-01-01' AND created_at<'2024-01-01' GROUP BY 1
  - id: time-05
    category: time
    question: 2023年逐月看已售库存单元数，按售出时间统计。
    reference_sql: SELECT DATE_TRUNC('month',sold_at) AS time,COUNT(*) AS sold_inventory_unit_count FROM analytics.inventory_items WHERE sold_at>='2023-01-01' AND sold_at<'2024-01-01' GROUP BY 1
  - id: time-06
    category: time
    question: 2023年按月汇总事件数，保留匿名事件。
    reference_sql: SELECT DATE_TRUNC('month',created_at) AS time,COUNT(*) AS event_count FROM analytics.events WHERE created_at>='2023-01-01' AND created_at<'2024-01-01' GROUP BY 1
  - id: time-07
    category: time
    question: 按年统计2022年和2023年的注册用户数。
    reference_sql: SELECT DATE_TRUNC('year',created_at) AS time,COUNT(*) AS registered_user_count FROM analytics.users WHERE created_at>='2022-01-01' AND created_at<'2024-01-01' GROUP BY 1
  - id: time-08
    category: time
    question: 2023年每个月的平均完成订单金额是多少？
    reference_sql: SELECT time,AVG(amount) AS average_order_value FROM (SELECT o.order_id,DATE_TRUNC('month',o.created_at) AS time,SUM(i.sale_price) AS amount FROM analytics.orders o JOIN analytics.order_items i ON i.order_id=o.order_id WHERE o.status='Complete' AND o.created_at>='2023-01-01' AND o.created_at<'2024-01-01' GROUP BY o.order_id,DATE_TRUNC('month',o.created_at)) q GROUP BY time

  - id: continuous-01
    category: continuous
    conversation_group: sales-drilldown
    question: 全部时间哪个客户州的已完成成交额最高？
    reference_sql: SELECT u.state AS customer_state,SUM(i.sale_price) AS completed_sale_amount FROM analytics.orders o JOIN analytics.order_items i ON i.order_id=o.order_id JOIN analytics.users u ON u.id=o.user_id WHERE o.status='Complete' GROUP BY u.state ORDER BY completed_sale_amount DESC,customer_state LIMIT 1
  - id: continuous-02
    category: continuous
    conversation_group: sales-drilldown
    question: 这个州哪些商品品类卖得好？按刚才的成交额口径给前十名，画柱状图。
    chart: bar
    reference_sql: WITH best_state AS (SELECT u.state FROM analytics.orders o JOIN analytics.order_items i ON i.order_id=o.order_id JOIN analytics.users u ON u.id=o.user_id WHERE o.status='Complete' GROUP BY u.state ORDER BY SUM(i.sale_price) DESC,u.state LIMIT 1) SELECT p.category AS product_category,SUM(i.sale_price) AS completed_sale_amount FROM analytics.orders o JOIN analytics.order_items i ON i.order_id=o.order_id JOIN analytics.users u ON u.id=o.user_id JOIN analytics.products p ON p.id=i.product_id WHERE o.status='Complete' AND u.state=(SELECT state FROM best_state) GROUP BY p.category ORDER BY completed_sale_amount DESC,product_category LIMIT 10
  - id: continuous-03
    category: continuous
    conversation_group: sales-drilldown
    question: 改为前五名，其他条件不变。
    reference_sql: WITH best_state AS (SELECT u.state FROM analytics.orders o JOIN analytics.order_items i ON i.order_id=o.order_id JOIN analytics.users u ON u.id=o.user_id WHERE o.status='Complete' GROUP BY u.state ORDER BY SUM(i.sale_price) DESC,u.state LIMIT 1) SELECT p.category AS product_category,SUM(i.sale_price) AS completed_sale_amount FROM analytics.orders o JOIN analytics.order_items i ON i.order_id=o.order_id JOIN analytics.users u ON u.id=o.user_id JOIN analytics.products p ON p.id=i.product_id WHERE o.status='Complete' AND u.state=(SELECT state FROM best_state) GROUP BY p.category ORDER BY completed_sale_amount DESC,product_category LIMIT 5
