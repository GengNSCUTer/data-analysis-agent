name: Project Quality Checks

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[test]"
    - name: Run deterministic Python tests
      run: |
        python -m pytest -v \
          tests/test_tool_permissions.py \
          tests/test_llm_context_enhancer.py \
          tests/test_workflow.py \
          tests/test_memory_tools.py \
          tests/test_olist_transform.py \
          tests/test_sql_policy.py \
          tests/test_run_sql_tool.py
    - name: Compile project demo entry points
      run: python -m compileall -q \
        examples/siliconflow_sqlite_web_demo.py \
        examples/trusted_olist_web_demo.py
    - name: Build embedded chat component
      working-directory: frontends/webcomponent
      run: |
        npm install --package-lock=false
        npm run build
