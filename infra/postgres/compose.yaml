name: data-analysis-agent

x-product: &product
  image: data-analysis-agent:local
  build:
    context: ../..
  volumes:
    - app_data:/var/lib/data-analysis-agent

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: data_analysis_agent
      POSTGRES_USER: app_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  init:
    <<: *product
    command: ["data-analysis-agent-init", "--synthetic"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATA_ANALYSIS_ADMIN_DSN: postgresql://app_admin:${POSTGRES_PASSWORD}@db:5432/data_analysis_agent
      DATA_ANALYSIS_POSTGRES_HOST: db
      DATA_ANALYSIS_POSTGRES_PORT: "5432"
      DATA_ANALYSIS_READER_PASSWORD: ${DATA_ANALYSIS_READER_PASSWORD:?Set reader password}
      DATA_ANALYSIS_WRITER_PASSWORD: ${DATA_ANALYSIS_WRITER_PASSWORD:?Set writer password}

  app:
    <<: *product
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:?Set SILICONFLOW_API_KEY}
      SILICONFLOW_BASE_URL: ${SILICONFLOW_BASE_URL:-https://api.siliconflow.cn/v1}
      SILICONFLOW_MODEL: ${SILICONFLOW_MODEL:-deepseek-ai/DeepSeek-V3.2}
      DATA_ANALYSIS_POSTGRES_HOST: db
      DATA_ANALYSIS_POSTGRES_PORT: "5432"
      PGPASSFILE: /var/lib/data-analysis-agent/pgpass
      DATA_ANALYSIS_CATALOG_PATH: /var/lib/data-analysis-agent/synthetic-catalog.yaml
      DATA_ANALYSIS_DATASET_VERSION: synthetic-olist-v1
      DATA_ANALYSIS_BOOTSTRAP_USERNAME: analyst
      DATA_ANALYSIS_ACTIVE_REQUESTS: ${DATA_ANALYSIS_ACTIVE_REQUESTS:-4}
      DATA_ANALYSIS_QUEUED_REQUESTS: ${DATA_ANALYSIS_QUEUED_REQUESTS:-8}
      DATA_ANALYSIS_QUEUE_WAIT_SECONDS: ${DATA_ANALYSIS_QUEUE_WAIT_SECONDS:-15}
      DATA_ANALYSIS_MODEL_CALLS: ${DATA_ANALYSIS_MODEL_CALLS:-4}
      DATA_ANALYSIS_REQUEST_TIMEOUT_SECONDS: ${DATA_ANALYSIS_REQUEST_TIMEOUT_SECONDS:-180}
      DATA_ANALYSIS_LOGIN_PER_MINUTE: ${DATA_ANALYSIS_LOGIN_PER_MINUTE:-10}
      DATA_ANALYSIS_QUESTIONS_PER_MINUTE: ${DATA_ANALYSIS_QUESTIONS_PER_MINUTE:-30}
      DATA_ANALYSIS_ARTIFACT_RETENTION_SECONDS: ${DATA_ANALYSIS_ARTIFACT_RETENTION_SECONDS:-604800}
      DATA_ANALYSIS_ARTIFACT_CLEANUP_SECONDS: ${DATA_ANALYSIS_ARTIFACT_CLEANUP_SECONDS:-3600}
    stop_grace_period: 20s
    ports:
      - "127.0.0.1:${DATA_ANALYSIS_HTTP_PORT:-32013}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

volumes:
  postgres_data:
  app_data:
